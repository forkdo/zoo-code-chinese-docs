name: Documentation

on:
  push:
    branches:
      - docs
    paths:
      - 'docs_zh/**'
      - '.github/workflows/docs.yml'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    env:
      TZ: Asia/Shanghai
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Fetch Source
        run: |
          git clone https://github.com/Zoo-Code-Org/Zoo-Code-Docs.git docsite
          cd docsite
          git checkout $(cat ../commit.txt)
      - name: Setup pnpm and Node
        uses: pnpm/setup@v1
        with:
          version: 10
          install: false
      - name: Build Docs
        run: |
          cp -r docs_zh/* docsite/docs/
          cd docsite/
          pnpm install --config.dangerouslyAllowAllBuilds=true
          pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docsite/build
          retention-days: 1

  deploy-github-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      # - uses: actions/configure-pages@v6
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: ./build
      - name: Deploy to Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: ${{ vars.PAGES_DOMAIN }}
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: docsite/build
      # - uses: actions/deploy-pages@v5
      #   id: deployment

  deploy-ssh-server:
    needs: build
    runs-on: ubuntu-latest
    # 是否启用 SSH 服务器部署，默认不启用。
    # 在仓库 Settings → Secrets and variables → Actions → Variables 中
    # 添加变量 ENABLE_SSH_DEPLOY=true 即可开启。
    env:
      ENABLE_SSH_DEPLOY: ${{ vars.ENABLE_SSH_DEPLOY || 'false' }}
    if: ${{ vars.ENABLE_SSH_DEPLOY == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: docs-site
          path: ./build
      - name: Compress to tar.xz
        run: |
          tar -cJf docs-site.tar.xz build/
      - name: Set up SSH
        uses: LuisEnMarroquin/setup-ssh-action@v3.0.0
        with:
          ORIGIN: ${{ secrets.SSH_HOSTNAME }}
          SSHKEY: ${{ secrets.SSH_KEY }}
          NAME: webserver
          PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.SSH_USERNAME }}
      - run: echo "" >> ~/.ssh/access  # fix
      - name: Deploy the website
        env:
          WEBROOT: /data/wwwroot/zoocode
        run: |
          ssh webserver "rm -rf $WEBROOT && mkdir -p $WEBROOT"
          scp docs-site.tar.xz webserver:${WEBROOT}/
          ssh webserver "cd $WEBROOT && tar -xJf docs-site.tar.xz --strip-components=1 && rm -f docs-site.tar.xz"
